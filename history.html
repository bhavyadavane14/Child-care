<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Child's Health History – Mukta Child Health Hub</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />

  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Back Navigation Top Bar -->
  <div class="subpage-nav-bar">
    <div class="container subpage-nav-container">
      <a href="index.html" class="btn-back-hub" data-i18n="back_to_hub">
        &larr; Back to Health Hub
      </a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <!-- Language Selector -->
        <div class="lang-select-wrap">
          <label class="sr-only" for="mukta-lang-dropdown" data-i18n="language">Language</label>
          <span class="lang-globe" aria-hidden="true">🌐</span>
          <select id="mukta-lang-dropdown" class="lang-dropdown" onchange="setLanguage(this.value)" aria-label="Language">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="mr">मराठी</option>
          </select>
        </div>
        <span id="nav-child-avatar" style="font-size: 1.4rem;">👶</span>
        <strong id="nav-child-name" style="color: var(--text-dark);" data-i18n="active_child">Active Child</strong>
      </div>
    </div>
  </div>

  <!-- Subpage Header Banner -->
  <div class="subpage-hero-banner" style="background: linear-gradient(135deg, #F0EAFF 0%, #E5F4FF 100%);">
    <div class="container">
      <div class="section-tag tag-lavender" data-i18n="history_page_tag">📋 Clinical Records</div>
      <h1 class="subpage-hero-title" data-i18n="history_page_title">Health Records &amp; History</h1>
      <p class="subpage-hero-sub" data-i18n="history_page_desc">Comprehensive chronological record of growth measurements, vaccinations, and pediatric consultations.</p>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <!-- History Control Toolbar -->
      <div class="history-toolbar-card">
        <div class="toolbar-top-row">
          <!-- Time Presets Filter -->
          <div class="preset-filters-wrap">
            <span class="toolbar-label" data-i18n="time_range">Time Range:</span>
            <button class="filter-pill-small active" data-range="all" onclick="setMasterHistoryFilter('all', this)" data-i18n="all_records">All Records</button>
            <button class="filter-pill-small" data-range="yesterday" onclick="setMasterHistoryFilter('yesterday', this)" data-i18n="yesterday">Yesterday</button>
            <button class="filter-pill-small" data-range="last_7_days" onclick="setMasterHistoryFilter('last_7_days', this)" data-i18n="last_7_days">Last 7 Days</button>
            <button class="filter-pill-small" data-range="last_30_days" onclick="setMasterHistoryFilter('last_30_days', this)" data-i18n="last_30_days">Last 30 Days</button>
            <button class="filter-pill-small" data-range="last_3_months" onclick="setMasterHistoryFilter('last_3_months', this)" data-i18n="last_3_months">Last 3 Months</button>
            <button class="filter-pill-small" data-range="last_6_months" onclick="setMasterHistoryFilter('last_6_months', this)" data-i18n="last_6_months">Last 6 Months</button>
            <button class="filter-pill-small" data-range="last_year" onclick="setMasterHistoryFilter('last_year', this)" data-i18n="last_1_year">Last 1 Year</button>
          </div>

          <!-- Export Actions -->
          <div class="toolbar-actions">
            <button class="btn-pill-outline btn-sm" onclick="exportFullHistory()" data-i18n="export_full_history">📥 Export Full History (CSV)</button>
          </div>
        </div>

        <!-- Category Filters & Search -->
        <div class="toolbar-bottom-row">
          <div class="category-filters-wrap">
            <span class="toolbar-label" data-i18n="category_label">Category:</span>
            <button class="cat-filter-btn active" data-hcat="all" onclick="setMasterHistoryCategory('all', this)" data-i18n="all_categories">All Categories</button>
            <button class="cat-filter-btn" data-hcat="growth" onclick="setMasterHistoryCategory('growth', this)">📈 <span data-i18n="growth">Growth</span></button>
            <button class="cat-filter-btn" data-hcat="vaccination" onclick="setMasterHistoryCategory('vaccination', this)">💉 <span data-i18n="vaccination">Vaccines</span></button>
            <button class="cat-filter-btn" data-hcat="symptom" onclick="setMasterHistoryCategory('symptom', this)">🩺 <span data-i18n="symptom">Symptoms</span></button>
            <button class="cat-filter-btn" data-hcat="milestone" onclick="setMasterHistoryCategory('milestone', this)">🌱 <span data-i18n="milestone">Milestones</span></button>
            <button class="cat-filter-btn" data-hcat="nutrition" onclick="setMasterHistoryCategory('nutrition', this)">🥗 <span data-i18n="nutrition">Nutrition</span></button>
            <button class="cat-filter-btn" data-hcat="document" onclick="setMasterHistoryCategory('document', this)">🪪 <span data-i18n="document">Documents</span></button>
            <button class="cat-filter-btn" data-hcat="appointment" onclick="setMasterHistoryCategory('appointment', this)">📅 <span data-i18n="appointment">Appointments</span></button>
          </div>

          <div class="history-search-wrap">
            <input type="text" id="history-search-input" class="clean-input input-sm" placeholder="🔍 Search records..." data-i18n-placeholder="search_records" oninput="handleHistorySearch(this.value)" />
          </div>
        </div>
      </div>

      <!-- Master Activity Timeline Container -->
      <div class="master-timeline-wrapper" id="master-timeline-container">
        <!-- Rendered by app.js -->
        <div class="empty-state" data-i18n="loading_history">Loading complete health history...</div>
      </div>
    </div>
  </main>

  <footer class="clean-footer">
    <div class="container footer-bottom-container">
      <div data-i18n="footer_copy_short">© 2026 Mukta Children Hospital, Amravati.</div>
      <a href="index.html" style="color: #94A3B8;" data-i18n="back_to_home_link">Back to Home</a>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="translations.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
